name: Checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality, security and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Check builds identify the event commit; release builds embed the validated tag.
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/versions.mk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.mk') }}
      - name: Install pinned analysis tools
        run: make tools
      - name: Check production module and supporting files
        run: make check

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/config
            target: FuzzConfig
          - package: ./internal/watcher/fanotify
            target: FuzzFIDRecords
    env:
      GOMAXPROCS: '2'
      FUZZ_PACKAGE: ${{ matrix.package }}
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_TIME: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '60s' || '20s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz untrusted input parsers
        run: make fuzz

  packages:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      # A Debian version must start with a digit; release builds use the tag instead.
      VERSION: v0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The amd64 tests run in the check job; this is the only place the arm64 code runs.
      - name: Test on arm64
        if: matrix.arch == 'arm64'
        run: make test
      - name: Build release packages
        run: make release VERSION="$VERSION"
      - name: Install, check and remove the .deb on Ubuntu
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends "./bin/release/fsledger_0.0.0~ci_$ARCH.deb"
          for binary in fsledger fsledgerd; do
            version=$("$binary" --version)
            [[ "$version" == "fsledger $VERSION ("* ]]
            [[ "$version" == *"linux/$ARCH)" ]]
            printf '%s\n' "$version"
          done
          test "$(sudo stat -c %a /etc/fsledger)" = 700
          sudo fsledger check -c /etc/fsledger/fsledger.yaml
          systemctl cat fsledger.service
          # Installation must leave the service disabled and stopped until the configuration is reviewed.
          test "$(systemctl is-enabled fsledger.service || true)" = disabled
          test "$(systemctl is-active fsledger.service || true)" = inactive
          sudo apt-get remove -y fsledger
          test ! -e /usr/sbin/fsledgerd
          sudo test -e /etc/fsledger/fsledger.yaml
          sudo apt-get purge -y fsledger
          sudo test ! -e /etc/fsledger/fsledger.yaml
