name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  linux-x86_64:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Linux x86_64 assets
        shell: bash
        run: |
          # Validate event data before passing it to Make's variable expansion.
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
            echo "Release tags must start with a letter or digit and use only letters, digits, dots, _, + or -." >&2
            exit 1
          fi
          make release VERSION="$RELEASE_TAG"
      - name: Verify packaged binaries and checksums
        shell: bash
        run: |
          for binary in bin/release/fsledger-linux-x86_64 bin/release/fsledgerd-linux-x86_64; do
            version=$("$binary" --version)
            [[ "$version" == "fsledger $RELEASE_TAG ("* ]]
            [[ "$version" == *"linux/amd64)" ]]
            printf '%s\n' "$version"
          done
          cd bin/release
          sha256sum --check SHA256SUMS
      - name: Attach assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            bin/release/fsledger-linux-x86_64 \
            bin/release/fsledgerd-linux-x86_64 \
            bin/release/LICENSE \
            bin/release/SHA256SUMS
