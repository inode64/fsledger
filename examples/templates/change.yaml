# Named template "change" for immediate email/Slack alerts; reports use their own renderer.
# Same as the built-in template. DisplayFields/DisplayBaseline render timestamps, sizes and modes
# for people and hide fields without evidence for a reader; BackdatedBy flags an mtime earlier
# than btime; ActorLines shows the actor evidence as lines; CommonDetection states the detection
# method once when every path shares it. Up to DetailLimit paths (Detailed) every detail is
# listed; larger summaries group paths by actor without per-path fields. Stored evidence is unchanged.
subject: 'fsledger {{.Host}} / {{.Repository}}: {{.Event}} ({{.Count}}: +{{.Added}} ~{{.Modified}} -{{.Deleted}})'
body: |-
  {{$common := .CommonDetection}}Servidor: {{.Host}} ({{.Hostname}})
  Observaciones: {{.Count}} (+{{.Added}} ~{{.Modified}} -{{.Deleted}})
  {{if .ChangeID}}Cambio: {{.ChangeID}}
  {{end}}{{with $common}}Detección: {{.}}
  {{end}}{{if .Reason}}Motivo: {{.Reason}}
  {{end}}{{if .Detailed}}
  Elementos cambiados
  Clave  Ruta
  {{range .Details}}{{printf "%-5s" .Code}}  {{printf "%q" .Path}}
  {{else}}{{range .Paths}}—      {{printf "%q" .}}
  {{end}}{{end}}
  C = Creado; D = Borrado; M = Contenido; P = Solo permisos; MP = Contenido y permisos.
  — = Otros metadatos o sin evidencia suficiente para clasificar.

  Detalle de cambios
  {{range .Details}}
  Ruta: {{printf "%q" .Path}} / {{.Code}}
  {{if .ChangeID}}ID de cambio: {{.ChangeID}}
  {{end}}Observado: {{localtime .Observed}}
  {{if not $common}}{{with .Detection}}Detección: {{.}}
  {{end}}{{end}}Actor:{{with .ActorLines}}{{range .}}
      {{.}}{{end}}{{else}} sin evidencia{{end}}
  {{with .BackdatedBy}}AVISO: mtime es {{duration .}} anterior a btime, la creación de esta versión del fichero:
  fecha conservada al copiar (tar, rsync -a, cp -p) o falseada.
  {{end}}{{range .DisplayFields}}{{.Field}}: {{.Before}} -> {{.After}}
  {{else}}Sin diferencias de campos visibles.
  {{end}}{{with .DisplayBaseline}}Comparación con referencia aprobada:
  {{range .}}{{.Field}}: {{.Before}} -> {{.After}}
  {{end}}{{end}}{{end}}{{else}}
  Elementos cambiados, agrupados por actor
  Más de {{.DetailLimit}} rutas: se omite el detalle de campos por ruta; el catálogo conserva la evidencia completa.
  C = Creado; D = Borrado; M = Contenido; P = Solo permisos; MP = Contenido y permisos.
  — = Otros metadatos o sin evidencia suficiente para clasificar.
  {{$actor := "\x00"}}{{$change := "\x00"}}{{range .Details}}
  {{- if or (ne .Actor $actor) (ne .ChangeID $change)}}{{$actor = .Actor}}{{$change = .ChangeID}}
  {{if .ChangeID}}ID de cambio: {{.ChangeID}}
  {{end}}{{if not $common}}{{with .Detection}}Detección: {{.}}
  {{end}}{{end}}Actor:{{with .ActorLines}}{{range .}}
      {{.}}{{end}}{{else}} sin evidencia{{end}}
  Clave  Ruta
  {{end}}{{printf "%-5s" .Code}}  {{printf "%q" .Path}}{{if .BackdatedBy}}  [mtime anterior a btime]{{end}}
  {{else}}{{range .Paths}}—      {{printf "%q" .}}
  {{end}}{{end}}{{end}}
